[package]
name = "raft-consensus"
version = "0.1.0"
edition = "2021"
description = "Raft consensus algorithm implemented from scratch in Rust"

[dependencies]
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
serde_json = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "raft_benchmarks"
harness = false
